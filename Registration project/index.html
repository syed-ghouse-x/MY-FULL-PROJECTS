    <div class=" flex bg-[#fff6cc] items-center justify-center h-screen ">
        <div class="border border-black rounded-xl  w-xs flex pt-5 pb-5 bg-[#c8c8ce] shadow-xl/50 ">
            <div class="flex flex-col gap-1 justify-center items-center pl-10 ">
                <h1 class="text-3xl  ">Login Form</h1>
                <div class="flex flex-col">
                    <label for="" class="font-medium">Name : </label>
                    <input id="nameid" class="border rounded-sm text text-[#0a182f]" type="text" placeholder="Enter your name">
                </div>
                <div class="flex flex-col">
                    <label for="" class="font-medium">Phone : </label>
                    <input id="phoneid" class="border rounded-sm text-[#0a182f]" type="number" placeholder="+91 0000000000">
                </div>
                <div class="flex flex-col">
                    <label for="" class="font-medium">Email : </label>
                    <input id="emailid" class="border rounded-sm text-[#0a182f]" type="email" placeholder="abc@gmail.com">
                </div>
                <div class="flex flex-col">
                    <label for="" class="font-medium">Password : </label>
                    <input id="passwordid" class="border rounded-sm text-[#0a182f]" type="password" placeholder="Enter your password">
                </div>
                <div class="flex flex-col pl-5  ">
                    <label for="" class="font-medium">Confirm Password : </label>
                    <div class="flex gap-1">
                    <input id="confirmpasswordid" class="border rounded-sm text-[#0a182f]" type="password" placeholder="Re-Enter your password">
                    <img src="eye.png" id="eye" class="w-5 cursor-pointer" alt="">
                    </div>
                </div>
                <div class="flex gap-4">
                    <p id="capcha"></p>
                    <img id="imageid" class="w-7 cursor-pointer" src="refresh.png" alt="">

                </div>
                <div class="flex flex-col">
                    <label for="" class="font-medium">Captcha : </label>
                    <input id="capchainput" class="border rounded-sm text-[#0a182f]" type="text" placeholder="Enter Captcha">
                </div>
                <button type="button" id="Submitid" class=" flex mt-1  bg-blue-500 text-white w-30 cursor-pointer  text-center justify-center  rounded-full  ">Submit</button>
            </div>
        </div>
    </div>
    <script src="function.js"></script>
</body>

</html>
